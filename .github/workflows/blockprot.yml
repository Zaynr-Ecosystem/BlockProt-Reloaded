name: BlockProt Reloaded

run-name: "${{ github.event_name == 'workflow_dispatch' && format('{0}: {1} [{2}] [{3}]', inputs.operation, inputs.tag || 'version from gradle.properties', inputs.suffix, inputs.edition) || github.event_name == 'schedule' && 'Scheduled platform sync and maintenance' || format('CI: {0}', github.event.head_commit.message || github.ref_name) }}"

on:
  push:
    branches: [ main, BlockProt-Reloaded-Legacy, BlockProt-Legacy ]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.gitignore'
  pull_request:
    branches: [ main, BlockProt-Reloaded-Legacy, BlockProt-Legacy ]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.gitignore'
  schedule:
    - cron: '0 6 * * *'
    - cron: '20 6 * * *'
    - cron: '40 6 * * *'
    - cron: '0 7 * * 1'
    - cron: '10 7 * * 1'
    - cron: '20 7 * * 1'
  workflow_dispatch:
    inputs:
      edition:
        description: "Which edition to run"
        type: choice
        options:
          - "bpr"
          - "bpr-legacy"
          - "bp-legacy"
        default: "bpr"
      operation:
        description: "What to run"
        type: choice
        options:
          - "Preview release (dry run)"
          - "Publish release"
          - "Sync platforms (publish the latest stable release where missing)"
          - "Maintenance report"
          - "Run CI"
        default: "Preview release (dry run)"
      suffix:
        description: "Release suffix: keep the one in gradle.properties, publish the next numbered BEDev build, or release as stable"
        type: choice
        options:
          - "From gradle.properties"
          - "BEDev (next numbered build)"
          - "Stable (remove suffix and update gradle.properties)"
        default: "From gradle.properties"
      tag:
        description: "Release notes version override (leave blank to use the version from gradle.properties)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.schedule }}-${{ inputs.edition }}-${{ inputs.operation }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  edition:
    name: Resolve Edition
    runs-on: ubuntu-latest
    outputs:
      edition: ${{ steps.resolve.outputs.edition }}
      operation: ${{ steps.resolve.outputs.operation }}
      branch: ${{ steps.resolve.outputs.branch }}
      commit_branch: ${{ steps.resolve.outputs.commit_branch }}
      tag_prefix: ${{ steps.resolve.outputs.tag_prefix }}
      jar_base: ${{ steps.resolve.outputs.jar_base }}
      title: ${{ steps.resolve.outputs.title }}
      make_latest: ${{ steps.resolve.outputs.make_latest }}
      smoke_matrix: ${{ steps.resolve.outputs.smoke_matrix }}
      modrinth_enabled: ${{ steps.resolve.outputs.modrinth_enabled }}
      modrinth_id: ${{ steps.resolve.outputs.modrinth_id }}
      curseforge_enabled: ${{ steps.resolve.outputs.curseforge_enabled }}
      curseforge_id: ${{ steps.resolve.outputs.curseforge_id }}
      curseforge_slug: ${{ steps.resolve.outputs.curseforge_slug }}
      hangar_enabled: ${{ steps.resolve.outputs.hangar_enabled }}
      hangar_slug: ${{ steps.resolve.outputs.hangar_slug }}
      hangar_owner: ${{ steps.resolve.outputs.hangar_owner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve edition and operation
        id: resolve
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          python3 .github/scripts/edition.py resolve \
            --event "${{ github.event_name }}" \
            --schedule "${{ github.event.schedule }}" \
            --input-edition "${{ inputs.edition }}" \
            --input-operation "${{ inputs.operation }}" \
            --ref-name "${{ github.base_ref || github.ref_name }}"

  ci:
    name: Build, Verify & Audit
    needs: [edition]
    if: needs.edition.outputs.operation == 'ci'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.edition.outputs.branch || '' }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --quiet pyyaml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate commit convention
        env:
          BASE: ${{ github.base_ref }}
        run: |
          echo "Validating commit messages against BPR:<branch>(<type>): <description> convention..."
          REGEX="^BPR:(main|[a-zA-Z0-9_.-]+)\((fix|add|feat|refactor|docs|chore)\):\s.+"
          FAILED=0

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --no-merges --format="%s" "origin/$BASE..HEAD")
          else
            COMMITS=$(git log -1 --format="%s")
          fi

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if ! echo "$msg" | grep -qE "$REGEX"; then
              echo "ERROR: Commit message does not follow convention: '$msg'"
              echo "Required format: BPR:<branch>(<type>): <description>"
              echo "Valid types: fix, add, feat, refactor, docs, chore"
              FAILED=1
            fi
          done <<< "$COMMITS"

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "All commit messages comply with repository convention."

      - name: Validate version field integrity
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          echo "Verifying gradle.properties version immutability..."
          if git diff "origin/$BASE..HEAD" -- gradle.properties | grep -qE '^\+[ ]*(blockProtVersion|versionSuffix)='; then
            echo "ERROR: gradle.properties version fields were modified."
            echo "Rule: Plugin release version numbers and tags are managed exclusively by the maintainer."
            echo "Please revert modifications to blockProtVersion and versionSuffix."
            exit 1
          fi
          echo "Version field integrity verified."

      - name: Run automation script tests
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Run project file integrity audit
        run: |
          python3 .github/scripts/verify_project_integrity.py --report-path build/reports/integrity-report.md --summary

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and execute test suite
        run: ./gradlew build --no-daemon

      - name: Execute upstream server and dependency audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/audit_dependencies.py --json-output build/reports/dependency-audit.json --no-summary

      - name: Generate version commit summary
        run: |
          python3 .github/scripts/generate_version_commits.py --no-summary

      - name: Generate and publish unified CI report
        run: |
          python3 .github/scripts/generate_ci_summary.py

      - name: Publish integrity report to summary
        if: always()
        run: |
          if [ -f "build/reports/integrity-report.md" ]; then
            cat build/reports/integrity-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compiled shadow JAR artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: BlockProtReloaded-build-artifacts
          path: spigot/build/libs/${{ needs.edition.outputs.jar_base }}-*.jar
          retention-days: 7

      - name: Upload CI verification and audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports
          path: |
            build/reports/ci-summary.md
            build/reports/integrity-report.md
            build/reports/version-commits.md
            build/reports/dependency-audit.json
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            spigot/build/reports/tests/test/
            common/build/reports/tests/test/
          retention-days: 7

  server-smoke:
    name: Real Server Diagnostics (${{ matrix.project }} ${{ matrix.version }})
    needs: [edition, ci]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.edition.outputs.smoke_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.edition.outputs.branch || '' }}

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download compiled shadow JAR
        uses: actions/download-artifact@v8
        with:
          name: BlockProtReloaded-build-artifacts
          path: build/ci-jar

      - name: Boot server and run console diagnostics
        run: |
          JAR=$(find build/ci-jar -name "${{ needs.edition.outputs.jar_base }}-*.jar" | head -1)
          {
            echo "## Real Server Diagnostics"
            echo ""
            echo "| Server | Result | Diagnostics |"
            echo "| :--- | :---: | :--- |"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/server_smoke_test.py --jar "$JAR" --project "${{ matrix.project }}" --version "${{ matrix.version }}" --java "$JAVA_HOME/bin/java" --workdir build/smoke-server --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload server log and debug report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ needs.edition.outputs.edition }}-${{ matrix.project }}-${{ matrix.version }}
          path: |
            build/smoke-server/console.log
            build/smoke-server/plugins/BlockProtReloaded/logs/
          retention-days: 7

  player-tests:
    name: Player Tests on Every Supported Version
    needs: [edition]
    if: ${{ (needs.edition.outputs.operation == 'preview' || needs.edition.outputs.operation == 'publish' || needs.edition.outputs.operation == 'maintenance') }}
    uses: ./.github/workflows/player-tests.yml
    with:
      ref: ${{ needs.edition.outputs.branch }}

  sync-check:
    name: Platform Publication Check
    needs: [edition]
    if: needs.edition.outputs.operation == 'sync'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.status.outputs.version }}
      tag: ${{ steps.status.outputs.tag }}
      targets: ${{ steps.status.outputs.targets }}
      needed: ${{ steps.status.outputs.needed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check the latest stable release on every platform
        id: status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: python3 .github/scripts/platform_status.py --edition "${{ needs.edition.outputs.edition }}" --title "Latest stable release" --min-age-hours ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}

  inspect-and-build:
    name: Pre-Flight Inspection & Artifact Verification
    needs: [edition, sync-check]
    if: ${{ !cancelled() && needs.edition.result == 'success' && (needs.sync-check.outputs.needed == 'true' || needs.edition.outputs.operation == 'preview' || needs.edition.outputs.operation == 'publish') }}
    runs-on: ubuntu-latest
    outputs:
      plugin_version: ${{ steps.meta.outputs.plugin_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version_suffix: ${{ steps.meta.outputs.version_suffix }}
      stable_promotion: ${{ steps.meta.outputs.stable_promotion }}
      game_versions: ${{ steps.meta.outputs.game_versions }}
      supported_platforms: ${{ steps.meta.outputs.supported_platforms }}
      legacy_platforms: ${{ steps.meta.outputs.legacy_platforms }}
      unsupported_platforms: ${{ steps.meta.outputs.unsupported_platforms }}
      unsupported_versions: ${{ steps.meta.outputs.unsupported_versions }}
      loaders: ${{ steps.meta.outputs.loaders }}
      jar_name: ${{ steps.jar.outputs.name }}
      jar_size: ${{ steps.jar.outputs.size }}
      jar_sha256: ${{ steps.jar.outputs.sha256 }}
      jar_channel: ${{ steps.jar.outputs.channel }}
      github_only: ${{ steps.jar.outputs.github_only }}
      notes_path: ${{ steps.changelog.outputs.notes_path }}
      notes_url: ${{ steps.changelog.outputs.notes_url }}
      notes_source: ${{ steps.changelog.outputs.notes_source }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.sync-check.outputs.tag || needs.edition.outputs.branch }}

      - name: Resolve metadata and server platforms from gradle.properties
        id: meta
        env:
          SUFFIX_CHOICE: ${{ github.event.inputs.suffix }}
          TAG_PREFIX: ${{ needs.edition.outputs.tag_prefix }}
        run: |
          PROPS="gradle.properties"
          BASE_VER=$(grep -E '^[[:space:]]*blockProtVersion=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')
          SUFFIX=$(grep -E '^[[:space:]]*versionSuffix=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')
          PROPS_SUFFIX="$SUFFIX"
          case "$SUFFIX_CHOICE" in
            BEDev*) SUFFIX="BEDev" ;;
            Stable*) SUFFIX="" ;;
          esac
          if echo "$SUFFIX" | grep -qiE '^(bedev|bdev)(\.[0-9]+)?$'; then
            LAST=0
            for T in $(git tag -l "${TAG_PREFIX}${BASE_VER}-BEDev.*"); do
              N="${T##*-BEDev.}"
              if echo "$N" | grep -qE '^[0-9]+$' && [ "$N" -gt "$LAST" ]; then LAST="$N"; fi
            done
            SUFFIX="BEDev.$((LAST + 1))"
          fi
          if [ -z "$SUFFIX" ] && [ -n "$PROPS_SUFFIX" ]; then
            STABLE_PROMOTION="true"
          else
            STABLE_PROMOTION="false"
          fi
          echo "version_suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "props_suffix=${PROPS_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "stable_promotion=${STABLE_PROMOTION}" >> "$GITHUB_OUTPUT"
          if [ -n "$SUFFIX" ]; then
            PLUGIN_VER="${BASE_VER}-${SUFFIX}"
          else
            PLUGIN_VER="${BASE_VER}"
          fi

          MC_LINE=$(grep -E '^[[:space:]]*#[[:space:]]*Supported on blockProtVersion' "$PROPS" | head -1)
          RAW_MC=$(echo "$MC_LINE" | cut -d':' -f2 | tr -d '\r\n')
          MC_LIST=$(echo "$RAW_MC" | tr -d ' ')
          FIRST_MC=$(echo "$MC_LIST" | awk -F',' '{print $1}')
          LATEST_MC=$(echo "$MC_LIST" | awk -F',' '{print $NF}')
          MC_RANGE="${FIRST_MC} - ${LATEST_MC}"

          # Format game versions for mc-publish (newline-delimited)
          MC_NEWLINES=$(echo "$RAW_MC" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r' | grep -v '^$')
          EXPANDED_MC=()
          while IFS= read -r v; do
            [ -z "$v" ] && continue
            EXPANDED_MC+=("$v")
            if [ "$v" = "26.1" ]; then
              EXPANDED_MC+=("26.1.1" "26.1.2")
            fi
          done <<< "$MC_NEWLINES"
          MC_NEWLINES=$(printf "%s\n" "${EXPANDED_MC[@]}")

          PLATFORMS=$(grep -E '^[[:space:]]*supportedPlatforms=' "$PROPS" | cut -d'=' -f2 | tr -d '\r\n')
          LEGACY=$(grep -E '^[[:space:]]*legacyPlatforms=' "$PROPS" | cut -d'=' -f2 | tr -d '\r\n')
          UNSUPPORTED_PLATFORMS=$(grep -E '^[[:space:]]*unsupportedPlatforms=' "$PROPS" | cut -d'=' -f2 | tr -d '\r\n')
          UNSUPPORTED_VERSIONS=$(grep -E '^[[:space:]]*unsupportedVersions=' "$PROPS" | cut -d'=' -f2 | tr -d '\r\n')
          LOADERS=$(echo "$PLATFORMS" | tr '[:upper:]' '[:lower:]' | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r' | grep -v '^$' | tr '\n' ' ')

          echo "plugin_version=${PLUGIN_VER}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG_PREFIX}${PLUGIN_VER}" >> "$GITHUB_OUTPUT"
          echo "mc_range=${MC_RANGE}" >> "$GITHUB_OUTPUT"
          echo "latest_mc=${LATEST_MC}" >> "$GITHUB_OUTPUT"
          {
            echo "game_versions<<EOF"
            echo "$MC_NEWLINES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "supported_platforms=${PLATFORMS}" >> "$GITHUB_OUTPUT"
          echo "legacy_platforms=${LEGACY}" >> "$GITHUB_OUTPUT"
          echo "unsupported_platforms=${UNSUPPORTED_PLATFORMS}" >> "$GITHUB_OUTPUT"
          echo "unsupported_versions=${UNSUPPORTED_VERSIONS}" >> "$GITHUB_OUTPUT"
          echo "loaders=${LOADERS}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes changelog
        id: changelog
        env:
          TAG_OVERRIDE: ${{ github.event.inputs.tag }}
          PLUGIN_VERSION: ${{ steps.meta.outputs.plugin_version }}
        run: |
          TARGET_TAG="${TAG_OVERRIDE:-$PLUGIN_VERSION}"
          CLEAN_TAG="${TARGET_TAG#v}"
          mkdir -p build/reports

          if [ -f "docs/RELEASE_NOTES/${TARGET_TAG}.RELEASE_NOTES.md" ]; then
            NOTES_SRC="docs/RELEASE_NOTES/${TARGET_TAG}.RELEASE_NOTES.md"
          elif [ -f "docs/RELEASE_NOTES/${CLEAN_TAG}.RELEASE_NOTES.md" ]; then
            NOTES_SRC="docs/RELEASE_NOTES/${CLEAN_TAG}.RELEASE_NOTES.md"
          elif echo "$CLEAN_TAG" | grep -qiE -- '-(bedev|bdev|snapshot|exp)' && [ -f "docs/RELEASE_NOTES/${CLEAN_TAG%%-*}.RELEASE_NOTES.md" ]; then
            NOTES_SRC="docs/RELEASE_NOTES/${CLEAN_TAG%%-*}.RELEASE_NOTES.md"
          elif [ -f "docs/RELEASE_NOTES/${PLUGIN_VERSION}.RELEASE_NOTES.md" ]; then
            NOTES_SRC="docs/RELEASE_NOTES/${PLUGIN_VERSION}.RELEASE_NOTES.md"
          else
            NOTES_SRC=""
          fi

          if [ -n "$NOTES_SRC" ]; then
            echo "Loading curated release notes from: $NOTES_SRC"
            cp "$NOTES_SRC" build/reports/release-notes.md
            REPO_URL="${{ github.repository }}"
            REF="${{ needs.edition.outputs.branch }}"
            echo "notes_source=curated" >> "$GITHUB_OUTPUT"
            echo "notes_path=$NOTES_SRC" >> "$GITHUB_OUTPUT"
            echo "notes_url=https://github.com/${REPO_URL}/blob/${REF}/${NOTES_SRC}" >> "$GITHUB_OUTPUT"
          else
            echo "Curated release notes not found; aggregating git commit history..."
            python3 .github/scripts/generate_version_commits.py --version "$TARGET_TAG" --release-body --output-file build/reports/release-notes.md
            echo "notes_source=generated" >> "$GITHUB_OUTPUT"
            echo "notes_path=build/reports/release-notes.md" >> "$GITHUB_OUTPUT"
            echo "notes_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Declare the player tests in the release notes
        if: ${{ needs.edition.outputs.operation != 'sync' }}
        run: |
          {
            echo ""
            echo "## Verification"
            echo ""
            echo "Before publication this build was tested in GitHub Actions ([run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})). Every supported Minecraft version (${{ steps.meta.outputs.mc_range }}) booted on real Paper, Folia and Purpur servers wherever that software publishes a build (a declared version without a build of its own runs on its newest hotfix), and passed the plugin console diagnostics. On every version the test client supports, a two-player protection test also passed: the owner protects and opens a chest, and a second player can neither open nor break it."
          } >> build/reports/release-notes.md

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build complete project artifacts
        run: ./gradlew build :blockprot-spigot:shadowJar --no-daemon "-PversionSuffix=${{ steps.meta.outputs.version_suffix }}"

      - name: Inspect compiled JAR, hash, and metadata
        id: jar
        run: |
          JAR_BASE="${{ needs.edition.outputs.jar_base }}"
          JAR=$(find spigot/build/libs -name "${JAR_BASE}-*.jar" \
                ! -name "*-javadoc*" ! -name "*-sources*" | head -1)
          JAR_NAME=$(basename "$JAR")
          VERSION=$(basename "$JAR" .jar | sed "s/^${JAR_BASE}-//")

          if echo "$VERSION" | grep -qiE 'snapshot|alpha|dev|nightly|wip|bedev'; then
            CHANNEL="alpha"
          elif echo "$VERSION" | grep -qiE 'beta|rc'; then
            CHANNEL="beta"
          else
            CHANNEL="release"
          fi

          if echo "$VERSION" | grep -qiE 'bedev|bdev|snapshot|(^|-)exp'; then
            GITHUB_ONLY="true"
          else
            GITHUB_ONLY="false"
          fi

          FILE_SIZE=$(ls -lh "$JAR" | awk '{print $5}')
          SHA256=$(sha256sum "$JAR" | awk '{print $1}')

          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$JAR_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "github_only=$GITHUB_ONLY" >> "$GITHUB_OUTPUT"
          echo "size=$FILE_SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Stage build artifacts for publication
        run: |
          mkdir -p build/staged-upload/clean
          mkdir -p build/staged-upload/github

          # 1. Clean distribution for plugin platforms (Modrinth, CurseForge, Hangar)
          cp "${{ steps.jar.outputs.path }}" build/staged-upload/clean/
          cp build/reports/release-notes.md build/staged-upload/clean/release-notes.md

          # 2. Complete build suite for GitHub Releases (binary, sources, javadocs, common, checksums)
          VERSION="${{ steps.jar.outputs.version }}"
          JAR_BASE="${{ needs.edition.outputs.jar_base }}"
          cp "${{ steps.jar.outputs.path }}" build/staged-upload/github/

          SRC_JAR=$(find spigot/build/libs -name "*-sources.jar" | head -1)
          if [ -n "$SRC_JAR" ] && [ -f "$SRC_JAR" ]; then
            cp "$SRC_JAR" "build/staged-upload/github/${JAR_BASE}-${VERSION}-sources.jar"
          fi

          DOC_JAR=$(find spigot/build/libs -name "*-javadoc.jar" | head -1)
          if [ -n "$DOC_JAR" ] && [ -f "$DOC_JAR" ]; then
            cp "$DOC_JAR" "build/staged-upload/github/${JAR_BASE}-${VERSION}-javadoc.jar"
          fi

          COMMON_JAR=$(find common/build/libs -name "common-*.jar" ! -name "*-sources*" ! -name "*-javadoc*" | head -1)
          if [ -n "$COMMON_JAR" ] && [ -f "$COMMON_JAR" ]; then
            cp "$COMMON_JAR" build/staged-upload/github/
          fi

          cp build/reports/release-notes.md build/staged-upload/github/release-notes.md

          cd build/staged-upload/github
          sha256sum *.jar > checksums.sha256
          cd ../../..

          echo "Staged clean files for distributor platforms:"
          ls -la build/staged-upload/clean
          echo "Staged complete build files for GitHub Releases:"
          ls -la build/staged-upload/github

      - name: Upload staged build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: blockprot-staged-release
          path: build/staged-upload/
          retention-days: 1

      - name: Publish Pre-Flight Inspection Summary
        env:
          EDITION_ID: ${{ needs.edition.outputs.edition }}
          EDITION_TITLE: ${{ needs.edition.outputs.title }}
          OPERATION: ${{ needs.edition.outputs.operation }}
          SYNC_NEEDED: ${{ needs.sync-check.outputs.needed }}
          VERSION: ${{ steps.meta.outputs.plugin_version }}
          SUFFIX: ${{ steps.meta.outputs.version_suffix }}
          PROPS_SUFFIX: ${{ steps.meta.outputs.props_suffix }}
          SUFFIX_CHOICE: ${{ github.event.inputs.suffix }}
          STABLE_PROMOTION: ${{ steps.meta.outputs.stable_promotion }}
          MC_RANGE: ${{ steps.meta.outputs.mc_range }}
          PLATFORMS: ${{ steps.meta.outputs.supported_platforms }}
          LEGACY: ${{ steps.meta.outputs.legacy_platforms }}
          UNSUPPORTED_PLATFORMS: ${{ steps.meta.outputs.unsupported_platforms }}
          UNSUPPORTED_VERSIONS: ${{ steps.meta.outputs.unsupported_versions }}
          JAR_NAME: ${{ steps.jar.outputs.name }}
          JAR_SIZE: ${{ steps.jar.outputs.size }}
          JAR_SHA256: ${{ steps.jar.outputs.sha256 }}
          CHANNEL: ${{ steps.jar.outputs.channel }}
          GITHUB_ONLY: ${{ steps.jar.outputs.github_only }}
          NOTES_SOURCE: ${{ steps.changelog.outputs.notes_source }}
          NOTES_PATH: ${{ steps.changelog.outputs.notes_path }}
          NOTES_URL: ${{ steps.changelog.outputs.notes_url }}
          MODRINTH_ENABLED: ${{ needs.edition.outputs.modrinth_enabled }}
          MODRINTH_TARGET: ${{ needs.edition.outputs.modrinth_id }}
          HAS_MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN != '' }}
          CURSEFORGE_ENABLED: ${{ needs.edition.outputs.curseforge_enabled }}
          CURSEFORGE_TARGET: Project ID ${{ needs.edition.outputs.curseforge_id }}
          HAS_CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN != '' }}
          HANGAR_ENABLED: ${{ needs.edition.outputs.hangar_enabled }}
          HANGAR_TARGET: ${{ needs.edition.outputs.hangar_slug }}
          HAS_HANGAR_TOKEN: ${{ secrets.HANGAR_API_TOKEN != '' }}
        run: |
          row() { printf '| **%s** | %s | %s |\n' "$1" "$2" "$3"; }
          platform_row() {
            local name="$1" enabled="$2" has_token="$3" target="$4" secret="$5"
            if [ "$enabled" != "true" ]; then
              row "$name" "[-] Not enabled" "Edition \`$EDITION_ID\` has no $name page enabled"
            elif [ "$has_token" = "true" ]; then
              row "$name" "[v] Ready" "\`$target\`"
            else
              row "$name" "[x] Missing Token" "Secret \`$secret\` not configured"
            fi
          }

          {
            echo "# Pre-Flight Release Inspection Report"
            echo ""
            echo "| Metric / Property | Evaluated Value | Source Location |"
            echo "| :--- | :--- | :--- |"
            row "Edition" "\`$EDITION_TITLE\` (\`$EDITION_ID\`)" "\`.github/editions.json\`"
            row "Active Version" "\`$VERSION\`" "\`gradle.properties\` (\`blockProtVersion\`)"
            row "Version Suffix" "\`${SUFFIX:-(none, stable)}\`" "Selected: $SUFFIX_CHOICE (gradle.properties: \`${PROPS_SUFFIX:-blank}\`)"
            if [ "$STABLE_PROMOTION" = "true" ]; then
              row "gradle.properties Update" "\`versionSuffix\` will be cleared and committed on Publish" "Stable promotion"
            fi
            row "Target Minecraft Range" "\`$MC_RANGE\`" "\`gradle.properties\` (\`Supported on...\`)"
            row "Supported Server Software" "\`$PLATFORMS\`" "\`gradle.properties\` (\`supportedPlatforms\`)"
            if [ -n "$LEGACY" ]; then
              row "Legacy / Deprecated Software" "\`$LEGACY\` (End-of-Support)" "\`gradle.properties\` (\`legacyPlatforms\`)"
            fi
            row "Unsupported Server Software" "\`$UNSUPPORTED_PLATFORMS\`" "\`gradle.properties\` (\`unsupportedPlatforms\`)"
            row "Unsupported Minecraft Versions" "\`$UNSUPPORTED_VERSIONS\`" "\`gradle.properties\` (\`unsupportedVersions\`)"
            row "Distribution Binary" "\`$JAR_NAME\` (\`$JAR_SIZE\`)" "\`spigot/build/libs/$JAR_NAME\`"
            row "Artifact SHA-256" "\`$JAR_SHA256\`" "Checksum verification"
            row "Release Channel" "\`$CHANNEL\`" "Inferred from version"
            if [ "$GITHUB_ONLY" = "true" ]; then
              row "Distribution Scope" "GitHub Releases only (pre-release)" "Development build suffix detected in version"
            else
              row "Distribution Scope" "GitHub and every enabled platform of the edition" "Stable or hotfix version"
            fi
            if [ "$NOTES_SOURCE" = "curated" ]; then
              row "Release Notes File" "[\`$NOTES_PATH\`]($NOTES_URL)" "Curated Project Release Documentation"
            else
              row "Release Notes File" "\`build/reports/release-notes.md\`" "Generated from Git history"
            fi

            echo ""
            echo "### Distribution Platform Credentials & Targets"
            echo ""
            echo "| Platform | Configuration Status | Target Project / Assets |"
            echo "| :--- | :---: | :--- |"
            row "GitHub Releases" "[v] Ready" "Complete Build Assets (Shadow JAR, Sources, Javadoc, Common, SHA-256)"
            platform_row "Modrinth" "$MODRINTH_ENABLED" "$HAS_MODRINTH_TOKEN" "$MODRINTH_TARGET" "MODRINTH_TOKEN"
            platform_row "CurseForge" "$CURSEFORGE_ENABLED" "$HAS_CURSEFORGE_TOKEN" "$CURSEFORGE_TARGET" "CURSEFORGE_TOKEN"
            platform_row "Hangar" "$HANGAR_ENABLED" "$HAS_HANGAR_TOKEN" "$HANGAR_TARGET" "HANGAR_API_TOKEN"
            echo ""
            if [ "$OPERATION" = "publish" ] || [ "$SYNC_NEEDED" = "true" ]; then
              echo "> [!NOTE]"
              echo "> **Publication requested.** The next job publishes once the player tests pass."
            else
              echo "> [!IMPORTANT]"
              echo "> **PRE-FLIGHT INSPECTION ONLY (DRY-RUN):** preview requested."
              echo "> Metadata, the compiled JAR, checksums, platform targets and release notes were gathered. The player tests report in their own job. **No files were uploaded to any platform.**"
              echo "> To publish this release, re-run this workflow with operation **Publish release**."
            fi
            echo ""
            echo "### Release Notes Preview"
            cat build/reports/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

  publish-platforms:
    name: Execute Multi-Platform Publication
    needs: [edition, sync-check, inspect-and-build, player-tests]
    if: ${{ !cancelled() && needs.inspect-and-build.result == 'success' && (needs.player-tests.result == 'success' || needs.player-tests.result == 'skipped') && (needs.edition.outputs.operation == 'publish' || needs.sync-check.outputs.needed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.sync-check.outputs.tag || needs.edition.outputs.branch }}

      - name: Download staged release artifacts
        uses: actions/download-artifact@v8
        with:
          name: blockprot-staged-release
          path: build/staged/

      - name: Locate staged artifacts and release notes
        id: staged
        run: |
          CLEAN_JAR=$(find build/staged/clean -name "${{ needs.edition.outputs.jar_base }}-*.jar" ! -name "*-javadoc*" ! -name "*-sources*" | head -1)
          CLEAN_NOTES=$(find build/staged/clean -name "release-notes.md" -o -name "*.md" | head -1)
          GITHUB_NOTES=$(find build/staged/github -name "release-notes.md" -o -name "*.md" | head -1)

          if [ -z "$CLEAN_JAR" ] || [ ! -f "$CLEAN_JAR" ]; then
            echo "::error::Could not find staged clean BlockProt JAR in build/staged/clean!"
            find build/staged -type f || true
            exit 1
          fi
          if [ -z "$CLEAN_NOTES" ] || [ ! -f "$CLEAN_NOTES" ]; then
            echo "::error::Could not find staged release notes in build/staged/clean!"
            find build/staged -type f || true
            exit 1
          fi

          echo "clean_jar=$CLEAN_JAR" >> "$GITHUB_OUTPUT"
          echo "clean_notes=$CLEAN_NOTES" >> "$GITHUB_OUTPUT"
          echo "github_notes=$GITHUB_NOTES" >> "$GITHUB_OUTPUT"
          echo "Staged Clean JAR (for distributors): $CLEAN_JAR ($(ls -lh "$CLEAN_JAR" | awk '{print $5}'))"
          echo "Staged GitHub Releases suite:"
          ls -la build/staged/github

      - name: Resolve release commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Promote gradle.properties to stable
        id: promote
        if: needs.inspect-and-build.outputs.stable_promotion == 'true'
        env:
          VERSION: ${{ needs.inspect-and-build.outputs.plugin_version }}
        run: |
          sed -i -E 's/^([[:space:]]*versionSuffix=).*/\1/' gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "BPR:${{ needs.edition.outputs.commit_branch }}(chore): Release ${VERSION}"
          git push origin "HEAD:${{ needs.edition.outputs.branch }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        id: gh_release
        if: needs.sync-check.outputs.needed != 'true' || contains(needs.sync-check.outputs.targets, 'github')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.inspect-and-build.outputs.release_tag }}
          target_commitish: ${{ steps.promote.outputs.sha || steps.head.outputs.sha }}
          name: "${{ needs.edition.outputs.title }} ${{ needs.inspect-and-build.outputs.plugin_version }}"
          body_path: ${{ steps.staged.outputs.github_notes }}
          files: |
            build/staged/github/${{ needs.edition.outputs.jar_base }}-*.jar
            build/staged/github/common-*.jar
            build/staged/github/checksums.sha256
          draft: false
          make_latest: ${{ needs.edition.outputs.make_latest }}
          prerelease: ${{ contains(needs.inspect-and-build.outputs.plugin_version, 'SNAPSHOT') || contains(needs.inspect-and-build.outputs.plugin_version, 'BEDev') || contains(needs.inspect-and-build.outputs.plugin_version, 'dev') || contains(needs.inspect-and-build.outputs.plugin_version, 'alpha') || contains(needs.inspect-and-build.outputs.plugin_version, 'beta') || contains(needs.inspect-and-build.outputs.plugin_version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect existing platform releases
        id: detect
        if: needs.inspect-and-build.outputs.github_only != 'true'
        run: |
          VERSION="${{ needs.inspect-and-build.outputs.plugin_version }}"
          MODRINTH_ID="${{ needs.edition.outputs.modrinth_id }}"
          CF_ID="${{ needs.edition.outputs.curseforge_id }}"
          HANGAR_SLUG="${{ needs.edition.outputs.hangar_slug }}"
          JAR_BASE="${{ needs.edition.outputs.jar_base }}"

          # 1. Modrinth duplicate check
          if [ "${{ needs.edition.outputs.modrinth_enabled }}" = "true" ] && curl -s "https://api.modrinth.com/v2/project/${MODRINTH_ID}/version" | grep -q "\"version_number\":\"${VERSION}\""; then
            echo "Modrinth already has version ${VERSION}. Will skip Modrinth upload to avoid duplicate conflict."
            echo "modrinth_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "modrinth_skip=false" >> "$GITHUB_OUTPUT"
          fi

          # 2. CurseForge duplicate check
          if [ "${{ needs.edition.outputs.curseforge_enabled }}" = "true" ] && curl -s "https://api.cfwidget.com/${CF_ID}" | grep -qF "\"name\":\"${JAR_BASE}-${VERSION}.jar\""; then
            echo "CurseForge already has version ${VERSION}. Will skip CurseForge upload to avoid duplicate conflict."
            echo "curseforge_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "curseforge_skip=false" >> "$GITHUB_OUTPUT"
          fi

          # 3. Hangar duplicate check
          if [ "${{ needs.edition.outputs.hangar_enabled }}" = "true" ] && curl -s "https://hangar.papermc.io/api/v1/projects/${HANGAR_SLUG}/versions?limit=10" | grep -q "\"name\":\"${VERSION}\""; then
            echo "Hangar already has version ${VERSION}. Will skip Hangar upload to avoid duplicate conflict."
            echo "hangar_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "hangar_skip=false" >> "$GITHUB_OUTPUT"
          fi

          # 4. Platforms not enabled for this edition are never published
          [ "${{ needs.edition.outputs.modrinth_enabled }}" = "true" ] || echo "modrinth_skip=true" >> "$GITHUB_OUTPUT"
          [ "${{ needs.edition.outputs.curseforge_enabled }}" = "true" ] || echo "curseforge_skip=true" >> "$GITHUB_OUTPUT"
          [ "${{ needs.edition.outputs.hangar_enabled }}" = "true" ] || echo "hangar_skip=true" >> "$GITHUB_OUTPUT"

          # 5. Scheduled sync: only publish to the platforms reported as missing
          if [ "${{ needs.sync-check.outputs.needed }}" = "true" ]; then
            TARGETS=",${{ needs.sync-check.outputs.targets }},"
            for P in modrinth curseforge hangar; do
              case "$TARGETS" in
                *",$P,"*) ;;
                *) echo "${P}_skip=true" >> "$GITHUB_OUTPUT" ;;
              esac
            done
          fi

      - name: Publish to Modrinth & CurseForge
        id: mc_publish
        if: needs.inspect-and-build.outputs.github_only != 'true' && ((env.MODRINTH_TOKEN != '' && steps.detect.outputs.modrinth_skip != 'true') || (env.CURSEFORGE_TOKEN != '' && steps.detect.outputs.curseforge_skip != 'true'))
        uses: Kir-Antipov/mc-publish@v3.3.2
        with:
          modrinth-id: ${{ needs.edition.outputs.modrinth_id }}
          modrinth-token: ${{ steps.detect.outputs.modrinth_skip != 'true' && secrets.MODRINTH_TOKEN || '' }}
          modrinth-unfeature-mode: none
          curseforge-id: ${{ needs.edition.outputs.curseforge_id }}
          curseforge-token: ${{ steps.detect.outputs.curseforge_skip != 'true' && secrets.CURSEFORGE_TOKEN || '' }}
          files: ${{ steps.staged.outputs.clean_jar }}
          name: "${{ needs.edition.outputs.title }} ${{ needs.inspect-and-build.outputs.plugin_version }}"
          version: ${{ needs.inspect-and-build.outputs.plugin_version }}
          version-type: ${{ needs.inspect-and-build.outputs.jar_channel }}
          changelog-file: ${{ steps.staged.outputs.clean_notes }}
          game-versions: ${{ needs.inspect-and-build.outputs.game_versions }}
          game-version-filter: none
          loaders: ${{ needs.inspect-and-build.outputs.loaders }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

      - name: Sync Modrinth version metadata
        id: modrinth_sync
        if: needs.inspect-and-build.outputs.github_only != 'true' && env.MODRINTH_TOKEN != '' && steps.detect.outputs.modrinth_skip == 'true'
        run: |
          VERSION="${{ needs.inspect-and-build.outputs.plugin_version }}"
          MODRINTH_ID="${{ needs.edition.outputs.modrinth_id }}"
          VERSIONS_JSON=$(curl -s -H "User-Agent: VictorGugug/BlockProt-Reloaded" "https://api.modrinth.com/v2/project/${MODRINTH_ID}/version")
          TARGET_ID=$(python3 -c "import sys, json; data = json.loads(sys.argv[1]); print(next((v['id'] for v in data if v['version_number'] == sys.argv[2]), ''))" "$VERSIONS_JSON" "$VERSION")
          if [ -n "$TARGET_ID" ]; then
            echo "Syncing Modrinth version $VERSION (ID: $TARGET_ID) game versions..."
            GV_JSON=$(python3 -c "import sys, json; print(json.dumps([v.strip() for v in sys.argv[1].splitlines() if v.strip()]))" "${{ needs.inspect-and-build.outputs.game_versions }}")
            RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH "https://api.modrinth.com/v2/version/${TARGET_ID}" \
              -H "Authorization: ${MODRINTH_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "User-Agent: VictorGugug/BlockProt-Reloaded" \
              -d "{\"game_versions\": $GV_JSON}")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "Successfully synced game_versions on Modrinth version $VERSION."
              echo "modrinth_synced=true" >> "$GITHUB_OUTPUT"
            else
              echo "Modrinth PATCH returned HTTP $HTTP_CODE: $BODY"
              echo "modrinth_synced=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Version $VERSION not found on Modrinth."
            echo "modrinth_synced=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Set up JDK 25
        if: needs.inspect-and-build.outputs.github_only != 'true' && env.HANGAR_API_TOKEN != '' && steps.detect.outputs.hangar_skip != 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        if: needs.inspect-and-build.outputs.github_only != 'true' && env.HANGAR_API_TOKEN != '' && steps.detect.outputs.hangar_skip != 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        if: needs.inspect-and-build.outputs.github_only != 'true' && env.HANGAR_API_TOKEN != '' && steps.detect.outputs.hangar_skip != 'true'
        run: chmod +x gradlew

      - name: Publish to Hangar
        id: hangar
        continue-on-error: true
        if: needs.inspect-and-build.outputs.github_only != 'true' && env.HANGAR_API_TOKEN != '' && steps.detect.outputs.hangar_skip != 'true'
        run: |
          CLEAN_TOKEN=$(echo "$HANGAR_API_TOKEN" | tr -d ' "\r\n\t'"'")
          LEN=${#CLEAN_TOKEN}
          if [ "$LEN" -ne 73 ]; then
            echo "::warning::HANGAR_API_TOKEN length is $LEN characters. Hangar requires a 73-character key (<UUID>.<token>). If publishing fails with 400 Bad Request, verify your secret in GitHub Settings."
          fi
          HANGAR_API_TOKEN="$CLEAN_TOKEN" ./gradlew :blockprot-spigot:publishPluginPublicationToHangar --stacktrace --no-daemon
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}

      - name: Publish Confirmation Summary
        if: always()
        env:
          VERSION: ${{ needs.inspect-and-build.outputs.plugin_version }}
          RELEASE_TAG: ${{ needs.inspect-and-build.outputs.release_tag }}
          GITHUB_ONLY: ${{ needs.inspect-and-build.outputs.github_only }}
          GITHUB_OUTCOME: ${{ steps.gh_release.outcome }}
          MC_PUBLISH_OUTCOME: ${{ steps.mc_publish.outcome }}
          HANGAR_OUTCOME: ${{ steps.hangar.outcome }}
          MODRINTH_SYNCED: ${{ steps.modrinth_sync.outputs.modrinth_synced }}
          MODRINTH_ENABLED: ${{ needs.edition.outputs.modrinth_enabled }}
          MODRINTH_SKIP: ${{ steps.detect.outputs.modrinth_skip }}
          MODRINTH_ID: ${{ needs.edition.outputs.modrinth_id }}
          CURSEFORGE_ENABLED: ${{ needs.edition.outputs.curseforge_enabled }}
          CURSEFORGE_SKIP: ${{ steps.detect.outputs.curseforge_skip }}
          CURSEFORGE_ID: ${{ needs.edition.outputs.curseforge_id }}
          HANGAR_ENABLED: ${{ needs.edition.outputs.hangar_enabled }}
          HANGAR_SKIP: ${{ steps.detect.outputs.hangar_skip }}
          HANGAR_SLUG: ${{ needs.edition.outputs.hangar_slug }}
        run: |
          row() { printf '| **%s** | %s | %s |\n' "$1" "$2" "$3"; }
          already_live() { row "$1" "[v] Already Live" "Version \`$VERSION\` was already published on $1 (skipped duplicate)"; }
          {
            echo "# Publication Summary"
            echo ""
            echo "| Platform | Upload Status | Details |"
            echo "| :--- | :---: | :--- |"
            case "$GITHUB_OUTCOME" in
              skipped) row "GitHub Releases" "[v] Already Live" "Release \`$RELEASE_TAG\` already exists" ;;
              success) row "GitHub Releases" "[v] Published" "Tag \`$RELEASE_TAG\` (Complete Build Assets Attached)" ;;
              *)       row "GitHub Releases" "[x] Failed" "Could not create GitHub Release" ;;
            esac
            if [ "$GITHUB_ONLY" = "true" ]; then
              row "Modrinth / CurseForge / Hangar" "[-] Not applicable" "Development build: published on GitHub Releases only"
            else
              if [ "$MODRINTH_ENABLED" != "true" ]; then
                row "Modrinth" "[-] Not enabled" "No Modrinth page enabled for this edition"
              elif [ "$MODRINTH_SYNCED" = "true" ]; then
                row "Modrinth" "[v] Metadata Synced" "Version \`$VERSION\` game versions updated on Modrinth"
              elif [ "$MODRINTH_SKIP" = "true" ]; then
                already_live "Modrinth"
              elif [ -z "$MODRINTH_TOKEN" ]; then
                row "Modrinth" "[x] Skipped" "Token not set"
              elif [ "$MC_PUBLISH_OUTCOME" = "success" ]; then
                row "Modrinth" "[v] Published" "Project \`$MODRINTH_ID\` (Clean Shadow JAR)"
              else
                row "Modrinth" "[x] Failed" "Upload step outcome: $MC_PUBLISH_OUTCOME"
              fi
              if [ "$CURSEFORGE_ENABLED" != "true" ]; then
                row "CurseForge" "[-] Not enabled" "No CurseForge page enabled for this edition"
              elif [ "$CURSEFORGE_SKIP" = "true" ]; then
                already_live "CurseForge"
              elif [ -z "$CURSEFORGE_TOKEN" ]; then
                row "CurseForge" "[x] Skipped" "Token not set"
              elif [ "$MC_PUBLISH_OUTCOME" = "success" ]; then
                row "CurseForge" "[v] Uploaded" "Project ID \`$CURSEFORGE_ID\` (listed after CurseForge review)"
              else
                row "CurseForge" "[x] Failed" "Upload step outcome: $MC_PUBLISH_OUTCOME"
              fi
              if [ "$HANGAR_ENABLED" != "true" ]; then
                row "Hangar" "[-] Not enabled" "No Hangar page enabled for this edition"
              elif [ "$HANGAR_SKIP" = "true" ]; then
                already_live "Hangar"
              elif [ -z "$HANGAR_API_TOKEN" ]; then
                row "Hangar" "[x] Skipped" "Token not set"
              elif [ "$HANGAR_OUTCOME" = "success" ]; then
                row "Hangar" "[v] Published" "Project \`$HANGAR_SLUG\` (Clean Shadow JAR)"
              else
                row "Hangar" "[!] Issue" "Check Hangar API key format (must be 73 characters <UUID>.<token>)"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Discord announcement template
        if: always() && steps.gh_release.outcome == 'success'
        env:
          VERSION: ${{ needs.inspect-and-build.outputs.plugin_version }}
          RELEASE_TAG: ${{ needs.inspect-and-build.outputs.release_tag }}
          EDITION_ID: ${{ needs.edition.outputs.edition }}
          EDITION_TITLE: ${{ needs.edition.outputs.title }}
          GITHUB_ONLY: ${{ needs.inspect-and-build.outputs.github_only }}
          REPO: ${{ github.repository }}
          MODRINTH_ENABLED: ${{ needs.edition.outputs.modrinth_enabled }}
          MODRINTH_ID: ${{ needs.edition.outputs.modrinth_id }}
          CURSEFORGE_ENABLED: ${{ needs.edition.outputs.curseforge_enabled }}
          CURSEFORGE_SLUG: ${{ needs.edition.outputs.curseforge_slug }}
          HANGAR_ENABLED: ${{ needs.edition.outputs.hangar_enabled }}
          HANGAR_OWNER: ${{ needs.edition.outputs.hangar_owner }}
          HANGAR_SLUG: ${{ needs.edition.outputs.hangar_slug }}
        run: |
          FENCE='```'
          if [ "$EDITION_ID" = "bpr" ]; then
            TITLE_PREFIX=""
          else
            TITLE_PREFIX="${EDITION_TITLE} "
          fi
          {
            echo ""
            echo "## Discord Announcement"
            echo ""
            echo "Copy each block into the release forum post."
            echo ""
            echo "**Post title**"
            echo "${FENCE}"
            echo "${TITLE_PREFIX}${VERSION} RELEASE"
            echo "${FENCE}"
            echo "**Tag**"
            echo "${FENCE}"
            echo "V - ${VERSION}"
            echo "${FENCE}"
            echo "**Message 1: GitHub release**"
            echo "${FENCE}"
            echo "https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
            echo "${FENCE}"
            if [ "$GITHUB_ONLY" = "true" ]; then
              echo "Development build: GitHub Releases only, no platform links."
            else
              echo "**Message 2: Download platforms**"
              echo "${FENCE}"
              if [ "$MODRINTH_ENABLED" = "true" ]; then
                echo "**MODRINTH:**"
                echo "https://modrinth.com/plugin/${MODRINTH_ID}/version/${VERSION}"
              fi
              if [ "$CURSEFORGE_ENABLED" = "true" ]; then
                echo "**CURSEFORGE:**"
                echo "https://www.curseforge.com/minecraft/bukkit-plugins/${CURSEFORGE_SLUG}"
              fi
              if [ "$HANGAR_ENABLED" = "true" ]; then
                echo "**HANGAR:**"
                echo "https://hangar.papermc.io/${HANGAR_OWNER}/${HANGAR_SLUG}/versions/${VERSION}"
              fi
              echo "${FENCE}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify-publication:
    name: Verify Publication on Every Platform
    needs: [edition, inspect-and-build, publish-platforms]
    if: ${{ !cancelled() && needs.publish-platforms.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Confirm the release is live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          EDITION_ID: ${{ needs.edition.outputs.edition }}
          MODRINTH_ENABLED: ${{ needs.edition.outputs.modrinth_enabled }}
          HANGAR_ENABLED: ${{ needs.edition.outputs.hangar_enabled }}
          VERSION: ${{ needs.inspect-and-build.outputs.plugin_version }}
          GITHUB_ONLY: ${{ needs.inspect-and-build.outputs.github_only }}
        run: |
          REQUIRED="github"
          if [ "$GITHUB_ONLY" != "true" ]; then
            [ "$MODRINTH_ENABLED" = "true" ] && REQUIRED="$REQUIRED modrinth"
            [ "$HANGAR_ENABLED" = "true" ] && REQUIRED="$REQUIRED hangar"
          fi
          for ATTEMPT in 1 2 3 4 5; do
            MISSING=$(python3 .github/scripts/platform_status.py --edition "$EDITION_ID" --version "$VERSION" | python3 -c "import json,sys; print(' '.join(json.load(sys.stdin)['missing']))")
            FAILED=""
            for P in $REQUIRED; do
              case " $MISSING " in *" $P "*) FAILED="$FAILED $P" ;; esac
            done
            [ -z "$FAILED" ] && break
            echo "Attempt $ATTEMPT: not visible yet on:$FAILED"
            sleep 60
          done
          GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" python3 .github/scripts/platform_status.py --edition "$EDITION_ID" --version "$VERSION" --title "Publication check" > /dev/null
          if [ "$GITHUB_ONLY" != "true" ]; then
            case " $MISSING " in
              *" curseforge "*) echo "::notice::CurseForge lists new files only after manual review; the daily platform sync republishes it if it is still missing after 72 hours." ;;
            esac
          fi
          if [ -n "$FAILED" ]; then
            echo "::error::Release $VERSION is not live on:$FAILED"
            exit 1
          fi

  maintenance:
    name: Upstream, Compatibility & Dependency Check
    needs: [edition]
    if: needs.edition.outputs.operation == 'maintenance'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.edition.outputs.branch }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --quiet pyyaml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build plugin JAR
        run: |
          chmod +x gradlew
          ./gradlew :blockprot-spigot:shadowJar --no-daemon

      - name: Run weekly checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(find spigot/build/libs -name "${{ needs.edition.outputs.jar_base }}-*.jar" ! -name "*-javadoc*" ! -name "*-sources*" | head -1)
          python3 .github/scripts/weekly_maintenance.py --edition "${{ needs.edition.outputs.edition }}" --jar "$JAR" --output build/reports/weekly-maintenance.md
          if [ -s build/reports/weekly-maintenance.md ]; then
            cat build/reports/weekly-maintenance.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No findings this week." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create, update, or close the maintenance issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ needs.edition.outputs.edition == 'bpr' && 'Weekly maintenance report' || format('Weekly maintenance report [{0}]', needs.edition.outputs.edition) }}
        run: |
          REPORT=build/reports/weekly-maintenance.md
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ ! -s "$REPORT" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Everything is up to date as of this week's check."
            fi
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            CURRENT=$(gh issue view "$EXISTING" --json body --jq .body)
            if [ "$CURRENT" = "$(cat "$REPORT")" ]; then
              echo "Report unchanged; issue #$EXISTING left as is."
              exit 0
            fi
            gh issue edit "$EXISTING" --body-file "$REPORT"
          else
            gh issue create --title "$TITLE" --body-file "$REPORT"
          fi

      - name: Upload maintenance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-maintenance
          path: |
            build/reports/weekly-maintenance.md
            build/reports/weekly-dependency-audit.json
            build/weekly-*/console.log
          retention-days: 14
