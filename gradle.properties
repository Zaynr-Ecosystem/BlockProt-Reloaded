# Version fields. Fixed values, set manually only when the project
# genuinely moves to a new version. Never bumped as a side effect of an
# unrelated change (Version Field Integrity).
blockProtVersion=1.4.1
versionSuffix=

# Supported on blockProtVersion=1.4.1: 1.21.7, 1.21.8, 1.21.9, 1.21.10, 1.21.11, 26.1, 26.2, 26.3

# JAR base name of this edition; the file is <jarBaseName>-<version>.jar.
jarBaseName=BlockProtReloaded

# Server platform software targets (single source of truth for distribution and CI metadata)
supportedPlatforms=Paper, Purpur, Folia
legacyPlatforms=Spigot
unsupportedPlatforms=Forge, Fabric, NeoForge, Bedrock Dedicated Server, BungeeCord, Velocity
unsupportedVersions=<=1.21.6 (Served by BlockProt Reloaded Legacy and BlockProt Legacy), >=26.4 (Subsequent Release Cycle Target)

# versionSuffix, appended to blockProtVersion with a dash. Leave blank for
# a clean stable release, producing BlockProtReloaded-1.3.4.jar. Set both
# blockProtVersion and versionSuffix manually; there is no auto-increment,
# each build uses exactly what is written here. The published GitHub
# release tag always equals this full version (e.g. tag "1.3.4-hotfix").
# Clean releases are just "1.3.4", no "-RELEASE" word is ever appended
# (older tags like "1.3.3-RELEASE" are legacy and are normalized to plain
# releases by the plugin).
#
# Intelligent version detection (used from now on): the update checker
# compares every published GitHub tag against the running version and
# notifies admins in-game (join, /bp update, Update Dialog), in the
# console, and mirrored into logs/blockprot-*.log, with the direct link
# to the detected release's tag page. This list is the source of truth
# for what each suffix means and what message it shows:
#
#   (blank)        -> 1.3.4             Clean stable release.
#                                       Message: "BlockProt is outdated!
#                                       New stable version: X" (+ link).
#   BEDev          -> 1.3.4-BEDev       Experimental dev build (pre-release;
#                                       Beta + Experimentation + Development).
#                                       Message: "BlockProt has a new
#                                       experimental development build (BEDev)
#                                       available: X. It is NOT a stable
#                                       version and is only published on
#                                       GitHub." Only ever shown to
#                                       pre-release servers; stable servers
#                                       ignore it. Running a BEDev build also
#                                       triggers a safety backup at startup
#                                       and the boot banner announces it.
#                                       ("bdev"/"SNAPSHOT" are legacy aliases
#                                       treated exactly like BEDev.)
#   hotfix[.N]     -> 1.3.4-hotfix      Critical bug-fix of the current
#                                       release, ranked ABOVE it: any server
#                                       on the base version (e.g. 1.3.4) is
#                                       notified as soon as the hotfix is
#                                       published.
#                                       Message (in-game, red/IMPORTANT):
#                                       "IMPORTANT: BlockProt has an
#                                       important bug-fix (hotfix) available:
#                                       X! It fixes bugs from the current
#                                       release (BASE). Click to download it."
#                                       where BASE is the version this hotfix
#                                       corrects (e.g. 1.3.4). Console:
#                                       "IMPORTANT: an important bug-fix
#                                       (hotfix) ... is available: X!"
#                                       (+ link). Same in the log.
#   fix[.N]        -> 1.3.4-fix.1       Targeted bugfix; same as hotfix.
#   patch[.N]      -> 1.3.4-patch.1     Same as hotfix.
#   exp            -> experimental branch builds; never shown as an update.

# Build and toolchain settings.
org.gradle.jvmargs=--enable-native-access=ALL-UNNAMED
org.gradle.java.installations.auto-download=true
# targetJavaVersion no longer controls the toolchain (fixed to JDK 25, bytecode 21, in build.gradle.kts).
targetJavaVersion=21

# Dependency versions.
nbtApiVersion=2.16.1
townyVersion=0.103.2.7
papiVersion=2.12.3
worldGuardVersion=7.0.17
